[package]
name = "guile-lsp"
version = "0.1.0"
edition = "2021"
publish = false
description = "A general Guile language server with optional Guix integration"

[dependencies]
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
libc = "0.2"
tower-lsp = "0.20"

[dev-dependencies]
serde_json = "1"
